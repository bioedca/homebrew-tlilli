# Minimal tap CI (PR-REL-021 in bioedca/Tlilli): style and audit the cask with
# the Homebrew that is preinstalled on the GitHub macOS runners. No third-party
# actions; the checkout is tapped in place.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  cask:
    name: brew style and audit
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tap this checkout
        # `brew tap <name> <url>` clones from any git URL, a local path included,
        # so the audit sees exactly the commit under test. Homebrew treats a
        # third-party tap as untrusted until `brew trust` runs, and `brew audit`
        # refuses to load a cask from an untrusted tap.
        run: |
          brew tap bioedca/tlilli "$GITHUB_WORKSPACE"
          brew trust bioedca/tlilli

      - name: brew style
        # By tap token, not by file: `brew style` rejects a cask file that is
        # not inside a tap ("Homebrew requires casks to be in a tap").
        run: brew style --cask bioedca/tlilli/tlilli

      - name: brew audit
        # `--online` downloads the asset and checks the checksum and livecheck.
        # Until the first release the cask carries the placeholders
        # `version "0.0.0"` and `sha256 :no_check`, and there is nothing to
        # download, so the audit stays offline while the placeholder is present.
        # The first bump PR from post-release.yml replaces `:no_check` with real
        # checksums and this step switches to the online audit by itself.
        run: |
          if grep -q 'sha256 :no_check' Casks/tlilli.rb; then
            echo "Placeholder checksum present (no release yet): auditing offline."
            brew audit --cask --strict bioedca/tlilli/tlilli
          else
            brew audit --cask --online --strict bioedca/tlilli/tlilli
          fi
